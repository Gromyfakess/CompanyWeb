<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056d6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="#090a0c" stroke="#1f2228" stroke-width="2"/>
  <!-- Dynamic speed lines -->
  <line x1="72" y1="32" x2="102" y2="32" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="80" y1="39" x2="104" y2="39" stroke="#0056d6" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <line x1="88" y1="46" x2="102" y2="46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Slashed S Motif -->
  <path d="M 32 38 C 32 32, 42 26, 56 26 C 72 26, 78 33, 76 43 C 74 53, 56 56, 50 61 C 42 67, 39 74, 43 83 C 48 93, 62 95, 74 92 C 84 89, 88 83, 89 77" fill="none" stroke="url(#grad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Precision Slash -->
  <line x1="30" y1="88" x2="68" y2="28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Foundation Swoosh -->
  <path d="M 44 94 C 62 98, 86 96, 106 82" fill="none" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
